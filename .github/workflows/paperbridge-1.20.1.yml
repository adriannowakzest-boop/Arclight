name: PaperBridge 1.20.1 build

on:
  workflow_dispatch:
  push:
    branches:
      - paperbridge-1.20.1
  pull_request:
    branches:
      - paperbridge-1.20.1

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 1.20.1 / Forge 47.4.29
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare pinned Paper 1.20.1 upstream sources
        run: bash scripts/prepare-paper-upstream.sh

      - name: Audit Paper patch impact against Arclight mixins
        run: bash scripts/audit-paper-patch-porting.sh

      - name: Prepare and remap Bukkit sources
        run: ./gradlew cleanBuild remapSpigotJar idea --no-daemon --stacktrace

      - name: Run Paper descriptor adapter tests
        run: ./gradlew :arclight-common:test --no-daemon --stacktrace

      - name: Build Arclight Forge 1.20.1
        run: ./gradlew build collect --no-daemon --stacktrace

      - name: Verify packaged installer, API, and Mixin wiring
        run: bash scripts/verify-paperbridge-artifact.sh build/libs

      - name: Upload Paper patch porting inventory
        uses: actions/upload-artifact@v4
        with:
          name: Paper-patch-porting-inventory
          path: build/paper-patch-porting-inventory.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperBridge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
