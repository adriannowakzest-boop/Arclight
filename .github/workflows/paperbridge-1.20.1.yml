name: PaperBridge 1.20.1 build

on:
  workflow_dispatch:
  push:
    branches:
      - paperbridge-1.20.1
  pull_request:
    branches:
      - paperbridge-1.20.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare and remap Bukkit sources
        run: ./gradlew cleanBuild remapSpigotJar idea --no-daemon --stacktrace

      - name: Run Paper descriptor adapter tests
        run: ./gradlew :arclight-common:test --no-daemon --stacktrace

      - name: Build Arclight Forge 1.20.1
        run: ./gradlew build collect --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperBridge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
